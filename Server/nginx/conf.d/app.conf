# --- FRONTEND HTTP REDIRECT ---
server {
    listen 80;
    listen [::]:80;
    server_name feasiblerealestate.com www.feasiblerealestate.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- BACKEND HTTP REDIRECT ---
server {
    listen 80;
    listen [::]:80;
    server_name api.feasiblerealestate.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- FRONTEND HTTPS SERVER ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name feasiblerealestate.com www.feasiblerealestate.com;

    ssl_certificate /etc/letsencrypt/live/feasiblerealestate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feasiblerealestate.com/privkey.pem;
    
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_frontend http://frontend:80;
        proxy_pass $upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- BACKEND HTTPS SERVER ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.feasiblerealestate.com;

    ssl_certificate /etc/letsencrypt/live/feasiblerealestate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feasiblerealestate.com/privkey.pem;
    
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_app http://app:3000;
        proxy_pass $upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
